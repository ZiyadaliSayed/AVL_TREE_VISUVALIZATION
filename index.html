<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AVL Tree Visualizer — Professional Edition</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 400: '#2dd4bf' }
          },
          fontFamily: {
            inter: ['Inter', 'ui-sans-serif', 'system-ui'],
          }
        }
      }
    }
  </script>

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    <link rel="stylesheet" href="style.css">
  </style>
</head>
<body class="antialiased">

  <div class="max-w-7xl mx-auto p-4 md:p-6">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-semibold text-white">AVL Tree Visualizer</h1>
        <p class="text-sm text-slate-300 mt-1">Watch self-balancing (AVL) rotations in a tidier, more compact layout.</p>
      </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <section class="lg:col-span-1 bg-slate-800 p-4 rounded-lg border border-slate-700 space-y-4">
        <div>
          <label for="userList" class="block text-sm text-slate-300 mb-2">Provide comma-separated numbers</label>
          <input id="userList" type="text" placeholder="e.g. 10,20,30,5,15" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded text-white focus:ring-2 focus:ring-cyan-400" />
        </div>

        <div class="flex items-center gap-3 p-2 bg-slate-900 rounded-md">
            <input type="checkbox" id="avlToggle" class="h-4 w-4 rounded bg-slate-700 border-slate-600 text-cyan-500 focus:ring-cyan-500" checked>
            <label for="avlToggle" class="text-sm text-slate-200">Enable AVL Balancing</label>
        </div>

        <div class="flex gap-3">
          <button id="generateBtn" class="btn bg-cyan-400 text-slate-900 rounded hover:brightness-95 flex-grow" aria-live="polite">Build Tree</button>
          <button id="resetBtn" class="btn bg-slate-700 border border-slate-600 text-white">Reset</button>
        </div>
        
        <div id="treeStats" class="text-sm text-slate-400 flex justify-around p-2 bg-slate-900 rounded-md">
            <span>Nodes: <strong id="nodeCountStat" class="text-white">0</strong></span>
            <span>Height: <strong id="treeHeightStat" class="text-white">0</strong></span>
        </div>

        <div class="border-t border-slate-700"></div>

        <div class="space-y-3">
            <label class="block text-sm text-slate-300">Operations</label>
            <div class="flex gap-2">
              <input id="searchInput" type="number" placeholder="Find value" class="w-full px-2 py-1 bg-slate-900 border border-slate-700 rounded text-white" />
              <button id="findBtn" class="btn bg-amber-500 text-slate-900">Find</button>
            </div>
            <div class="flex gap-2">
                <input id="deleteInput" type="number" placeholder="Delete value" class="w-full px-2 py-1 bg-slate-900 border border-slate-700 rounded text-white" />
                <button id="deleteBtn" class="btn bg-red-500 text-white">Delete</button>
            </div>
        </div>
        
        <div class="space-y-2">
            <label class="block text-sm text-slate-300">Traversals</label>
            <div class="grid grid-cols-2 gap-2">
              <button id="inorderBtn" class="btn bg-slate-700 text-white">In-order</button>
              <button id="preorderBtn" class="btn bg-slate-700 text-white">Pre-order</button>
              <button id="postorderBtn" class="btn bg-slate-700 text-white">Post-order</button>
              <button id="bfsBtn" class="btn bg-slate-700 text-white">BFS (Level)</button>
            </div>
        </div>

        <div class="border-t border-slate-700"></div>
        
        <div class="space-y-2">
            <label class="block text-sm text-slate-300">Animation Controls</label>
            <div class="flex gap-2">
                <button id="pauseResumeBtn" class="btn bg-slate-700 text-white w-full">Pause</button>
                <button id="stepBtn" class="btn bg-slate-700 text-white w-full" disabled>Step</button>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Animation speed</label>
                <input id="delayRange" type="range" min="100" max="1500" step="50" value="600" class="w-full" />
                <div class="text-xs text-slate-400 mt-1">Delay: <span id="delayVal">600</span> ms</div>
            </div>
        </div>
      </section>

      <!-- Main Canvas and Log -->
      <section class="lg:col-span-2 bg-slate-800 p-4 rounded-lg border border-slate-700 flex flex-col gap-4">
        <div id="canvasContainer">
            <div id="canvas">
              <svg id="edge-svg"></svg>
            </div>
        </div>
        <div id="log"></div>
      </section>
    </main>
  </div>

<script src="script.js"></script>
</body>
</html>
